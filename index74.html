<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>SmileCare</title>
    <link rel="stylesheet" href="./css/styles74.css" />
  </head>
  <body>
    <form class="form">
      <p class="form-label">Appointment type</p>
      <div class="form-options">
      <label>
        <input type="radio" name="appointment" value="consultation">
        Consultation
      </label>
      <label>
        <input type="radio" name="appointment" value="checkup">
        Checkup
      </label>
      <label>
        <input type="radio" name="appointment" value="treatment">
        Treatment
      </label>
    </div>
      <!-- Додай радіокнопки: Consultation, Checkup, Treatment -->
      <button class="form-button" type="submit">Book appointment</button>
    </form>
  </body>
</html>
