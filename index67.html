<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>SmileCare</title>
    <link rel="stylesheet" href="./css/styles67.css" />
  </head>
  <body>
    <form class="form">
        <label class="form-label">
            Email
            <input type="email" name="email" class="form-input" />
        </label>
        <label class="form-label">
            Password
            <input type="password" name="password" class="form-input" />
        </label>
        <label class="form-label">
            Phone
            <input type="tel" name="phone" class="form-input" />
        </label>
        <label class="form-label">
            Age
            <input type="number" name="age" class="form-input" />
        </label>
      <button class="form-button" type="submit">Sign up</button>
    </form>
  </body>
</html>
