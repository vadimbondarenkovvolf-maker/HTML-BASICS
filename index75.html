<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>SmileCare</title>
    <link rel="stylesheet" href="./css/styles75.css" />
  </head>
  <body>
    <form class="form">
      <p class="form-label">Symptoms</p>
      <!-- Додай чекбокси: Toothache, Sensitivity, Bleeding gums, Bad breath -->
      <div class="form-options">
        <label class="form-label">
            <input type="checkbox" name="symptom" value="toothache">
            Toothache
        </label>
        <label class="form-label">
            <input type="checkbox" name="symptom" value="sensitivity">
            Sensitivity
        </label>
        <label class="form-label">
            <input type="checkbox" name="symptom" value="bleeding">
            Bleeding gums
        </label>
        <label class="form-label">
            <input type="checkbox" name="symptom" value="bad-breath">
            Bad breath
        </label>
      </div>

      <button class="form-button" type="submit">Book appointment</button>
    </form>
  </body>
</html>
