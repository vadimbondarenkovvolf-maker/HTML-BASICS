<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>SmileCare</title>
    <link rel="stylesheet" href="./css/styles77.css" />
  </head>
  <body>
    <form class="form">
      <fieldset class="form-fieldset">
        <legend class="form-legend">Appointment type</legend>
        <label class="form-option">
          <input
            class="form-radio"
            type="radio"
            name="appointment"
            value="consultation"
            checked
          />
          Consultation
        </label>
        <label class="form-option">
          <input
            class="form-radio"
            type="radio"
            name="appointment"
            value="checkup"
          />
          Checkup
        </label>
        <label class="form-option">
          <input
            class="form-radio"
            type="radio"
            name="appointment"
            value="treatment"
          />
          Treatment
        </label>
      </fieldset>
      <button class="form-button" type="submit">Book appointment</button>
    </form>
  </body>
</html>
