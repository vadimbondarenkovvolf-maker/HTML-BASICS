<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>SmileCare</title>
    <link rel="stylesheet" href="./css/styles68.css" />
  </head>
  <body>
    <form class="form" autocomplete="off">
      <label class="form-label">
        Email
        <input class="form-input" type="email" name="email" placeholder="example@mail.com"/>
      </label>
      <label class="form-label">
        Password
        <input class="form-input" type="password" name="password" placeholder="Min 8 characters"/>
      </label>
      <button class="form-button" type="submit">Sign up</button>
    </form>
  </body>
</html>
