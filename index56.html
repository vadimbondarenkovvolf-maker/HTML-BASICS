<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="./css/styles56.css" />
    <title>Cats</title>
  </head>
  <body>
    <ul class="cards">
      <li class="card">
        <div class="card-thumb">
          <img class="card-img" src="https://images.pexels.com/photos/45201/kitty-cat-kitten-pet-45201.jpeg" alt="Orange tabby cat" />
        </div>
        <p class="card-name">Oliver</p>
      </li>
      <li class="card">
        <div class="card-thumb">
          <img class="card-img" src="https://images.pexels.com/photos/416160/pexels-photo-416160.jpeg" alt="White fluffy cat" />
        </div>
        <p class="card-name">Luna</p>
      </li>
      <li class="card">
        <div class="card-thumb">
          <img class="card-img" src="https://images.pexels.com/photos/596590/pexels-photo-596590.jpeg" alt="Grey cat with green eyes" />
        </div>
        <p class="card-name">Milo</p>
      </li>
    </ul>
  </body>
</html>
