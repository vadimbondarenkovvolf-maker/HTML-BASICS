<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>SmileCare</title>
    <link rel="stylesheet" href="./css/styles78.css" />
  </head>
  <body>
    <form class="form">
      <fieldset class="form-fieldset">
        <legend class="form-legend">Symptoms</legend>
        <div class="form-option">
          <input
            class="form-checkbox"
            type="checkbox"
            name="symptom"
            value="toothache"
            id="toothache"
            checked
          />
          <label class="form-label" for="toothache">Toothache</label>
        </div>
        <div class="form-option">
          <input
            class="form-checkbox"
            type="checkbox"
            name="symptom"
            value="sensitivity"
            id="sensitivity"
          />
          <label class="form-label" for="sensitivity">Sensitivity</label>
        </div>
        <div class="form-option">
          <input
            class="form-checkbox"
            type="checkbox"
            name="symptom"
            value="bleeding"
            id="bleeding"
          />
          <label class="form-label" for="bleeding">Bleeding gums</label>
        </div>
      </fieldset>
      <button class="form-button" type="submit">Book appointment</button>
    </form>
  </body>
</html>
