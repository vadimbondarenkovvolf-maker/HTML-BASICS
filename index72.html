<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>SmileCare</title>
    <link rel="stylesheet" href="./css/styles72.css" />
  </head>
  <body>
    <form class="form">
      <label class="form-label">
        Email
        <input
          class="form-input"
          type="email"
          name="email"
          placeholder="example@email.com"
          required
        />
      </label>
      <label class="form-label">
        Message
        <textarea class="form-textarea" name="messege" rows="5"
        placeholder="Enter your messege"></textarea>
      </label>
      <!-- Додай поле для повідомлення -->
      <button class="form-button" type="submit">Send message</button>
    </form>
  </body>
</html>
